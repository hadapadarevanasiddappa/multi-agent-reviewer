name: Virtual AI Engineering Team

on:
  push:
    branches:
      - main
    paths:
      - '**.py' # Only trigger the AI if Python files were changed

jobs:
  run-ai-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run AI Agent Team
        # This securely pulls the free API key you saved in the repository settings
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python agent_team.py