name: Virtual AI Engineering Team

on:
  pull_request: # Trigger only when a PR is created or updated
    branches:
      - main
    paths:
      - '**.py'

jobs:
  run-ai-agents:
    runs-on: ubuntu-latest
    # Give the pipeline permission to write comments
    permissions:
      pull-requests: write 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run AI Agent Team
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python agent_team.py

      - name: Post PR Comment
        # GITHUB_TOKEN is automatically provided by GitHub, you do NOT need to create it!
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file report.md